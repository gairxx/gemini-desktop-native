id: org.native.GeminiDesktop
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: gemini-desktop-native

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --socket=session-bus
  - --device=all
  - --filesystem=xdg-download
  - --filesystem=xdg-config/autostart:create
  - --own-name=org.freedesktop.AI.Control
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.*
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: intltool
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd
        mirror-urls:
          - https://sources.suse.com/SUSE:SLE-15-SP7:Update:BCI/000product/ca527df4d03bf96a67854a8ed2f0c64b/INCLUDED/SUSE:SLE-15-SP6:GA::intltool::45f77273c3f2ef792fa697b444183beb/intltool-0.51.0.tar.gz
          - https://mirror-hk.koddos.net/lfs/lfs-packages/12.0/intltool-0.51.0.tar.gz
      - type: patch
        paths:
          - flatpak/patches/intltool-perl5.26-regex-fixes.patch

  - name: libdbusmenu
    buildsystem: autotools
    build-options:
      cflags: -Wno-error
    cleanup:
      - '*.la'
      - /include
      - /lib/pkgconfig
      - /libexec
      - /share/doc
      - /share/gtk-doc
    config-opts:
      - --with-gtk=3
      - --disable-dumper
      - --disable-static
      - --disable-tests
      - --disable-gtk-doc
      - --enable-introspection=no
      - --disable-vala
    sources:
      - type: archive
        url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a
        mirror-urls:
          - https://sources.suse.com/SUSE:SLFO:Main:Build/libdbusmenu/a5b3e4717f09f90f9cd5568a5f933e8d/libdbusmenu-16.04.0.tar.gz
          - https://mirror.math.princeton.edu/pub/frugalware/frugalware-2.1/source/xlib/libdbusmenu/libdbusmenu-16.04.0.tar.gz
          - https://ftp.fr.openbsd.org/pub/OpenBSD/distfiles/libdbusmenu-16.04.0.tar.gz
      - type: patch
        paths:
          - flatpak/patches/0001-Fix-HAVE_VALGRIND-AM_CONDITIONAL.patch

  - name: ayatana-ido
    buildsystem: cmake-ninja
    cleanup:
      - /include
      - /lib/pkgconfig
    config-opts:
      - -DENABLE_INTROSPECTION=OFF
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/ayatana-ido.git
        tag: 0.10.4
        commit: f968079b09e2310fefc3fc307359025f1c74b3eb
      - type: patch
        paths:
          - flatpak/patches/0001-Make-introspection-configurable.patch

  - name: libayatana-indicator
    buildsystem: cmake-ninja
    cleanup:
      - /include
      - /lib/pkgconfig
      - /libexec
      - /share
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-indicator.git
        tag: 0.9.4
        commit: 611bb384b73fa6311777ba4c41381a06f5b99dad

  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    cleanup:
      - /include
      - /lib/pkgconfig
    config-opts:
      - -DENABLE_BINDINGS_MONO=NO
      - -DENABLE_BINDINGS_VALA=NO
      - -DENABLE_GTKDOC=NO
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-appindicator.git
        tag: 0.5.94
        commit: 31e8bb083b307e1cc96af4874a94707727bd1e79

  - name: gemini-desktop-native
    buildsystem: simple
    sources:
      - type: dir
        path: .
    build-commands:
      - mkdir -p /app/lib/gemini-desktop-native
      - cp src/__init__.py src/main.py src/webview.py src/spotlight.py src/tray.py src/hotkey.py src/mcp_dbus.py src/styles.css /app/lib/gemini-desktop-native/
      - |
        PFF=$(python3 -c 'import sys, sysconfig;print(sysconfig.get_paths()["purelib"].replace(sys.base_prefix,"/app"))')
        mkdir -p "$PFF"
        for w in flatpak/wheels/*.whl; do
          python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$w" "$PFF"
        done
      - mkdir -p /app/bin
      - |
        printf '%s\n' \
          '#!/usr/bin/python3' \
          'import sys' \
          'sys.path.insert(0, "/app/lib/gemini-desktop-native")' \
          'from main import main' \
          'sys.exit(main())' \
          > /app/bin/gemini-desktop-native
      - chmod 755 /app/bin/gemini-desktop-native
      - install -Dm644 org.native.GeminiDesktop.desktop /app/share/applications/org.native.GeminiDesktop.desktop
      - install -Dm644 org.native.GeminiDesktop.svg /app/share/icons/hicolor/scalable/apps/org.native.GeminiDesktop.svg